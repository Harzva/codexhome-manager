name: Feature request
description: Propose a Home, Skill Space, Household, CLI, or Desktop improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the command, screen, or routing behavior you expect.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Security and privacy impact
      description: Note any credential, filesystem, provider, or cross-Home boundary involved.
