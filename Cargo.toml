[workspace]
members = [
    "crates/codexhome-core",
    "crates/codexhome-cli",
]
resolver = "2"
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/harzva/codexhome-manager"
homepage = "https://github.com/harzva/codexhome-manager"
authors = ["Harzva"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
toml = "0.9"
